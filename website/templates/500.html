{% extends "base.html" %}
{% block title %}Server Error — GroupsGuru{% endblock %}

{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:2rem;">
  <div style="font-size:6rem;font-weight:800;color:#ff4d4d;line-height:1;">500</div>
  <h1 style="margin:1rem 0 0.5rem;color:var(--text);font-size:1.75rem;">Something Went Wrong</h1>
  <p style="color:var(--muted);max-width:400px;margin-bottom:2rem;">
    We hit an unexpected error. Please try again in a moment. If this keeps happening, contact us at
    <a href="mailto:support@groupsguru.in" style="color:var(--accent);">support@groupsguru.in</a>.
  </p>
  <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;">
    <a href="/" style="background:var(--accent);color:#000;padding:0.6rem 1.5rem;border-radius:8px;font-weight:700;text-decoration:none;">
      Go Home
    </a>
    <button onclick="history.back()" style="background:var(--surface);color:var(--text);border:1px solid var(--border);padding:0.6rem 1.5rem;border-radius:8px;font-weight:600;cursor:pointer;">
      Go Back
    </button>
  </div>
</div>
{% endblock %}
