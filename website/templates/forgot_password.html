{% extends "base.html" %}
{% block title %}Forgot Password — GroupsGuru{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">

    <h1 class="auth-title" data-i18n="pwd.forgot_title">Forgot Password</h1>
    <p class="auth-subtitle" data-i18n="pwd.forgot_sub">Enter your email and we'll send a reset link</p>

    {% if success %}
      <div class="auth-success" style="margin-bottom: 20px">{{ success }}</div>
    {% endif %}
    {% if error %}
      <div class="auth-error" style="margin-bottom: 20px">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/forgot-password">
      <div class="auth-field" style="margin-bottom: 20px">
        <label class="auth-label" data-i18n="pwd.email">Email Address</label>
        <div class="auth-input-row">
          <input type="email" name="email" class="auth-input" required autofocus placeholder="your@email.com">
        </div>
      </div>

      <button type="submit" class="auth-btn" data-i18n="pwd.send_btn">Send Reset Link</button>
    </form>

    <div class="auth-link-row" style="margin-top:2rem">
      <a href="/login" class="auth-forgot-link" data-i18n="pwd.back_login">← Back to Login</a>
    </div>

  </div>
</div>
{% endblock %}
