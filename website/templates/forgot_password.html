{% extends "base.html" %}
{% block title %}Forgot Password — GroupsGuru{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">

    <h1 class="auth-title">Forgot Password?</h1>
    <p class="auth-subtitle">We'll get you back in</p>

    <div class="auth-info-box">
      <div class="auth-info-icon">&#128274;</div>
      <p>Password reset via email is coming soon.</p>
      <p>For now, contact the admin to reset your password:</p>
      <p class="auth-info-contact">admin@groupsguru.in</p>
    </div>

    <div class="auth-link-row" style="margin-top:2rem">
      <a href="/login">&larr; Back to Login</a>
    </div>

  </div>
</div>
{% endblock %}
