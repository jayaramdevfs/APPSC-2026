{% extends "base.html" %}
{% block title %}Reset Password — GroupsGuru{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">

    <h1 class="auth-title" data-i18n="pwd.reset_title">Reset Password</h1>
    <p class="auth-subtitle" data-i18n="pwd.forgot_sub">Enter your email and we'll send a reset link</p>

    {% if error %}
      <div class="auth-error" style="margin-bottom: 20px">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/reset-password">
      <input type="hidden" name="token" value="{{ token }}">
      
      <div class="auth-field" style="margin-bottom: 20px">
        <label class="auth-label" data-i18n="pwd.new">New Password</label>
        <div class="auth-input-row">
          <input type="password" name="new_password" class="auth-input" required minlength="8" placeholder="••••••••">
        </div>
      </div>
      
      <div class="auth-field" style="margin-bottom: 20px">
        <label class="auth-label" data-i18n="pwd.confirm">Confirm Password</label>
        <div class="auth-input-row">
          <input type="password" name="confirm_password" class="auth-input" required minlength="8" placeholder="••••••••">
        </div>
      </div>

      <button type="submit" class="auth-btn" data-i18n="pwd.reset_btn">Reset Password</button>
    </form>

  </div>
</div>
{% endblock %}
