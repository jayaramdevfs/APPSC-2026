{% extends "base.html" %}
{% block title %}Change Password — GroupsGuru{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card">

    <h1 class="auth-title" data-i18n="pwd.change_title">Change Password</h1>
    <p class="auth-subtitle">{{ current_user.username }}@groupsguru.in</p>

    {% if error %}
    <div class="auth-error">{{ error }}</div>
    {% endif %}

    {% if success %}
    <div class="auth-success">{{ success }}</div>
    {% endif %}

    <form method="POST" action="/change-password" autocomplete="off">

      <div class="auth-field">
        <label class="auth-label" for="current_password" data-i18n="pwd.current">Current Password</label>
        <input
          class="auth-input"
          type="password"
          id="current_password"
          name="current_password"
          placeholder="••••••••"
          required
          autofocus
        >
      </div>

      <div class="auth-field">
        <label class="auth-label" for="new_password" data-i18n="pwd.new">New Password</label>
        <div class="auth-input-row">
          <input
            class="auth-input"
            type="password"
            id="new_password"
            name="new_password"
            placeholder="Min. 8 characters"
            minlength="8"
            required
          >
          <button type="button" class="auth-eye-btn" id="toggle-pwd" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="auth-pwd-strength" id="pwd-strength"></div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="confirm_password" data-i18n="pwd.confirm">Confirm New Password</label>
        <input
          class="auth-input"
          type="password"
          id="confirm_password"
          name="confirm_password"
          placeholder="Re-enter new password"
          required
        >
      </div>

      <button type="submit" class="auth-btn" data-i18n="pwd.change_btn">Change Password</button>

    </form>

    <div class="auth-link-row">
      <a href="/">&larr; Back to Home</a>
    </div>

  </div>
</div>

<script>
  document.getElementById('toggle-pwd').addEventListener('click', function() {
    const p = document.getElementById('new_password');
    p.type = p.type === 'password' ? 'text' : 'password';
  });

  document.getElementById('new_password').addEventListener('input', function() {
    const val = this.value;
    const el  = document.getElementById('pwd-strength');
    if (!val) { el.textContent = ''; el.className = 'auth-pwd-strength'; return; }
    if (val.length < 8)  { el.textContent = 'Too short'; el.className = 'auth-pwd-strength weak'; }
    else if (val.length < 12) { el.textContent = 'Good'; el.className = 'auth-pwd-strength ok'; }
    else { el.textContent = 'Strong'; el.className = 'auth-pwd-strength strong'; }
  });
</script>
{% endblock %}
