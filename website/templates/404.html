{% extends "base.html" %}
{% block title %}Page Not Found — GroupsGuru{% endblock %}

{% block content %}
<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;padding:2rem;">
  <div style="font-size:6rem;font-weight:800;color:var(--accent);line-height:1;">404</div>
  <h1 style="margin:1rem 0 0.5rem;color:var(--text);font-size:1.75rem;">Page Not Found</h1>
  <p style="color:var(--muted);max-width:400px;margin-bottom:2rem;">
    The page you're looking for doesn't exist or may have been moved.
  </p>
  <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;">
    <a href="/" style="background:var(--accent);color:#000;padding:0.6rem 1.5rem;border-radius:8px;font-weight:700;text-decoration:none;">
      Go Home
    </a>
    {% if current_user %}
    <a href="/dashboard" style="background:var(--surface);color:var(--text);border:1px solid var(--border);padding:0.6rem 1.5rem;border-radius:8px;font-weight:600;text-decoration:none;">
      Dashboard
    </a>
    {% endif %}
  </div>
</div>
{% endblock %}
