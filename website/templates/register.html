{% extends "base.html" %}
{% block title %}Register — GroupsGuru{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card" style="max-width:460px">

    <h1 class="auth-title">Create Account</h1>
    <p class="auth-subtitle">Join GroupsGuru APPSC 2026</p>

    {% if error %}
    <div class="auth-error">{{ error }}</div>
    {% endif %}

    <form method="POST" action="/register" autocomplete="off">

      <div class="auth-field">
        <label class="auth-label" for="username">Username</label>
        <div class="auth-input-row">
          <input
            class="auth-input auth-input-prefix"
            type="text"
            id="username"
            name="username"
            placeholder="ram"
            value="{{ vals.username if vals else '' }}"
            pattern="[a-zA-Z0-9_\-]{3,20}"
            title="3–20 characters: letters, numbers, _ or - only"
            required
            autofocus
          >
          <span class="auth-suffix">@groupsguru.in</span>
        </div>
        <p class="auth-hint">3–20 characters. Letters, numbers, _ or - only.</p>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="display_name">Display Name</label>
        <input
          class="auth-input"
          type="text"
          id="display_name"
          name="display_name"
          placeholder="Your Name"
          value="{{ vals.display_name if vals else '' }}"
          required
        >
      </div>

      <div class="auth-field">
        <label class="auth-label" for="email">
          Personal Email
          <span class="auth-label-opt">(optional — for future password reset)</span>
        </label>
        <input
          class="auth-input"
          type="email"
          id="email"
          name="email"
          placeholder="you@gmail.com"
          value="{{ vals.email if vals else '' }}"
        >
      </div>

      <div class="auth-field">
        <label class="auth-label" for="password">Password</label>
        <div class="auth-input-row">
          <input
            class="auth-input"
            type="password"
            id="password"
            name="password"
            placeholder="Min. 8 characters"
            minlength="8"
            required
          >
          <button type="button" class="auth-eye-btn" id="toggle-pwd" aria-label="Show password">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <div class="auth-pwd-strength" id="pwd-strength"></div>
      </div>

      <div class="auth-field">
        <label class="auth-label" for="confirm_password">Confirm Password</label>
        <input
          class="auth-input"
          type="password"
          id="confirm_password"
          name="confirm_password"
          placeholder="Re-enter password"
          required
        >
      </div>

      <button type="submit" class="auth-btn">Create Account</button>

    </form>

    <div class="auth-link-row">
      Already have an account? <a href="/login">Sign in</a>
    </div>

  </div>
</div>

<script>
  // Show/hide password
  document.getElementById('toggle-pwd').addEventListener('click', function() {
    const p = document.getElementById('password');
    p.type = p.type === 'password' ? 'text' : 'password';
  });

  // Password strength indicator
  document.getElementById('password').addEventListener('input', function() {
    const val = this.value;
    const el  = document.getElementById('pwd-strength');
    if (!val) { el.textContent = ''; el.className = 'auth-pwd-strength'; return; }
    if (val.length < 8)  { el.textContent = 'Too short'; el.className = 'auth-pwd-strength weak'; }
    else if (val.length < 12) { el.textContent = 'Good'; el.className = 'auth-pwd-strength ok'; }
    else { el.textContent = 'Strong'; el.className = 'auth-pwd-strength strong'; }
  });
</script>
{% endblock %}
