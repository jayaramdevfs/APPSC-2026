{% extends "base.html" %}

{% block title %}Job Calendar 2026 — APPSC{% endblock %}

{% block content %}
<div class="page-header">
    <a href="/" class="back-link">&larr; Back to Home</a>
    <h1 class="page-title">{{ title }}</h1>
    <p class="page-subtitle">Exam Notifications &amp; Schedule — Andhra Pradesh PSC</p>
</div>
<div class="pdf-container">
    <iframe src="{{ pdf_url }}" class="pdf-viewer" title="APPSC Job Calendar 2026 PDF"></iframe>
    <div class="pdf-mobile-fallback">
        <p>PDF preview is not supported in mobile browsers.<br>Tap below to open the full calendar.</p>
        <a href="{{ pdf_url }}" target="_blank" class="pdf-open-btn">&#128196; Open PDF</a>
    </div>
</div>
{% endblock %}
